[package]
name = "cga"
version = "0.1.0"
description = "Call graph analysis tool for Rust"
repository = "https://github.com/OpenDevicePartnership/cga"
authors = ["Wouter Geraedts <w.geraedts@sarif.n>"]
readme = "README.md"
license = "MIT"
keywords = ["lint", "plugin"]
categories = ["development-tools", "development-tools::cargo-plugins"]
build = "build.rs"
edition = "2024"
publish = false

[[bin]]
name = "cargo-cga"
test = false
path = "bin/cargo-cga.rs"

[[bin]]
name = "cga-driver"
path = "bin/cga-driver.rs"

[dependencies]
cga_analysis = { path = "cga_analysis" }
cga_data = { path = "cga_data" }
cga_cargo = { path = "cga_cargo" }

serde_json = "1.0"

[dev-dependencies]
ui_test = { version = "0.30.7", default-features = false, features = ["rustc"] }

[features]

[package.metadata.rust-analyzer]
# This package uses #[feature(rustc_private)]
rustc_private = true

[[test]]
name = "compile-test"
harness = false

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(bootstrap)']

[lints.clippy]
suspicious = "deny"
correctness = "deny"
perf = "deny"
style = "deny"